<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CS Cases — Админ-панель</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0f;
      --surface: #15151b;
      --surface-alt: #121218;
      --surface-input: #0a0a0f;
      --border: #232330;
      --border-light: #2c2c3a;
      --accent: #C6FF1E;
      --accent-dark: #9FE000;
      --text: #ffffff;
      --text-muted: #8a8a95;
      --text-dim: #63636e;
      --danger-bg: #3a1e1e;
      --danger-text: #ff8a8a;
      --danger-border: #5a2a2a;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
    }

    h1, h2, .value, .balance, .support-conv-name, .status-badge, .stat-value {
      font-family: "Space Grotesk", sans-serif;
    }

    /* ===== Экран входа ===== */
    #login-screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background:
        radial-gradient(circle at 20% 15%, rgba(198,255,30,0.06), transparent 40%),
        radial-gradient(circle at 85% 85%, rgba(198,255,30,0.04), transparent 45%),
        var(--bg);
    }

    .login-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 34px 26px;
      width: 100%;
      max-width: 340px;
      text-align: center;
    }

    .login-lock {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--accent-dark));
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
      font-size: 22px;
    }

    .login-card h1 {
      font-size: 17px;
      font-weight: 700;
      margin-bottom: 22px;
      letter-spacing: -0.2px;
    }

    .login-card input {
      width: 100%;
      background: var(--surface-input);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 13px;
      color: var(--text);
      font-size: 14px;
      margin-bottom: 12px;
      transition: border-color 0.15s ease;
    }

    .login-card input:focus { outline: none; border-color: var(--accent); }

    .btn {
      background: linear-gradient(90deg, var(--accent), var(--accent-dark));
      color: #10130a;
      font-weight: 700;
      border: none;
      padding: 13px;
      border-radius: 12px;
      cursor: pointer;
      width: 100%;
      font-size: 14px;
      transition: filter 0.15s ease, transform 0.1s ease;
    }

    .btn:hover { filter: brightness(1.08); }
    .btn:active { transform: scale(0.98); }

    .btn-secondary {
      background: var(--surface-alt);
      color: var(--text);
      font-weight: 600;
      border: 1px solid var(--border);
      padding: 10px 16px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 13px;
      transition: border-color 0.15s ease, background 0.15s ease;
    }

    .btn-secondary:hover { border-color: var(--border-light); background: #1a1a22; }
    .btn-secondary:disabled { opacity: 0.45; cursor: default; }

    .btn-danger {
      background: var(--danger-bg);
      color: var(--danger-text);
      font-weight: 600;
      border: 1px solid var(--danger-border);
      padding: 9px 14px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 12px;
      transition: filter 0.15s ease;
    }

    .btn-danger:hover { filter: brightness(1.15); }
    .btn-danger:disabled { opacity: 0.45; cursor: default; }

    .error-text { color: #ff5f5f; font-size: 12px; margin-top: 8px; min-height: 14px; }

    /* ===== Основной экран ===== */
    #app-screen { display: none; padding-bottom: 40px; }

    .header {
      padding: 14px 16px;
      background: var(--surface-alt);
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 5;
      border-bottom: 1px solid var(--border);
    }

    .header-logo {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .header-logo svg { width: 15px; height: 15px; flex-shrink: 0; }

    .header h1 {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.2px;
    }

    .header-tag {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.6px;
      color: #10130a;
      background: var(--accent);
      padding: 2px 6px;
      border-radius: 6px;
      margin-left: 6px;
      vertical-align: middle;
    }

    .tabs {
      display: flex;
      overflow-x: auto;
      background: var(--surface-alt);
      border-bottom: 1px solid var(--border);
      scrollbar-width: none;
    }

    .tabs::-webkit-scrollbar { display: none; }

    .tab-btn {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 13px 16px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      border-bottom: 2px solid transparent;
      white-space: nowrap;
      transition: color 0.15s ease;
    }

    .tab-btn .tab-icon { font-size: 14px; }

    .tab-btn:hover { color: #ccc; }

    .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }

    .tab-content { display: none; padding: 16px; }
    .tab-content.active { display: block; }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 12px;
      transition: border-color 0.15s ease;
    }

    .card-row {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      font-size: 13px;
      margin-bottom: 6px;
    }

    .card-row .label { color: var(--text-muted); flex-shrink: 0; }
    .card-row .value { font-weight: 600; text-align: right; word-break: break-all; }

    .status-badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 700;
    }

    .status-pending { background: #3a2f10; color: #ffb800; }
    .status-accepted { background: #10283a; color: #4da6ff; }
    .status-trade_sent { background: #2a1a3a; color: #b34dff; }
    .status-received { background: #123a1a; color: #4dff88; }
    .status-waiting { background: #3a2f10; color: #ffb800; }
    .status-finished { background: #123a1a; color: #4dff88; }
    .status-new { background: #3a2f10; color: #ffb800; }
    .status-in_progress { background: #10283a; color: #4da6ff; }
    .status-closed { background: #123a1a; color: #4dff88; }

    .card-actions { margin-top: 10px; display: flex; gap: 8px; flex-wrap: wrap; }
    .card-actions .btn-secondary, .card-actions .btn-danger { flex: 1; min-width: 120px; text-align: center; }

    .loading-text, .empty-text {
      color: var(--text-dim);
      font-size: 13px;
      padding: 30px 0;
      text-align: center;
    }

    /* Поддержка: список диалогов */
    .support-conv-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      cursor: pointer;
    }

    .support-conv-card:hover { border-color: var(--border-light); }

    .support-conv-info { min-width: 0; flex: 1; }

    .support-conv-name {
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .support-conv-preview {
      font-size: 12px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .support-conv-meta {
      text-align: right;
      flex-shrink: 0;
    }

    .support-conv-time {
      font-size: 11px;
      color: var(--text-dim);
      margin-bottom: 4px;
    }

    .support-unread-badge {
      display: inline-block;
      background: var(--accent);
      color: #10130a;
      font-size: 11px;
      font-weight: 700;
      border-radius: 10px;
      padding: 2px 8px;
      margin-top: 4px;
    }

    .support-conv-unread {
      border-color: rgba(198, 255, 30, 0.45);
    }

    .support-conv-unread .support-conv-name {
      color: var(--accent);
    }

    .support-filter-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 14px;
      cursor: pointer;
    }

    .support-filter-row input { accent-color: var(--accent); }

    /* Поддержка: окно чата */
    .support-chat-card {
      display: flex;
      flex-direction: column;
      max-height: 84vh;
    }

    .support-chat-header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 12px;
    }

    .support-chat-actions {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }

    .support-chat-actions button {
      flex: 1;
      font-size: 12px;
    }

    .support-chat-messages {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 12px;
      padding-right: 2px;
    }

    .support-chat-empty {
      text-align: center;
      color: var(--text-dim);
      font-size: 13px;
      padding: 20px 0;
    }

    .chat-bubble {
      max-width: 80%;
      padding: 9px 13px;
      border-radius: 14px;
      font-size: 13px;
      line-height: 1.45;
      word-break: break-word;
      white-space: pre-wrap;
    }

    .chat-bubble-admin-side {
      align-self: flex-end;
      background: linear-gradient(90deg, var(--accent), var(--accent-dark));
      color: #10130a;
      border-radius: 14px 14px 4px 14px;
    }

    .chat-bubble-user-side {
      align-self: flex-start;
      background: var(--surface-input);
      border: 1px solid var(--border);
      color: #eee;
      border-radius: 14px 14px 14px 4px;
    }

    .chat-bubble-system {
      align-self: center;
      background: transparent;
      color: var(--text-dim);
      font-size: 11px;
      text-align: center;
      max-width: 90%;
      padding: 2px 0;
    }

    .chat-bubble-system .chat-bubble-time { display: none; }

    .chat-bubble-time {
      font-size: 10px;
      opacity: 0.65;
      margin-top: 4px;
    }

    .support-chat-input-row {
      display: flex;
      gap: 8px;
      align-items: flex-end;
    }

    .support-chat-input-row textarea {
      flex: 1;
      background: var(--surface-input);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 11px;
      color: var(--text);
      font-size: 13px;
      font-family: inherit;
      resize: none;
      min-height: 42px;
      max-height: 100px;
      transition: border-color 0.15s ease;
    }

    .support-chat-input-row textarea:focus { outline: none; border-color: var(--accent); }

    .support-chat-send-btn {
      background: linear-gradient(90deg, var(--accent), var(--accent-dark));
      color: #10130a;
      font-weight: 700;
      border: none;
      border-radius: 12px;
      width: 42px;
      height: 42px;
      cursor: pointer;
      font-size: 15px;
      flex-shrink: 0;
    }

    .support-chat-send-btn:disabled { opacity: 0.5; cursor: default; }

    /* Пользователи */
    .balance-edit { display: flex; gap: 6px; margin-top: 10px; }
    .balance-edit input {
      flex: 1;
      background: var(--surface-input);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 9px;
      color: var(--text);
      font-size: 13px;
      transition: border-color 0.15s ease;
    }
    .balance-edit input:focus { outline: none; border-color: var(--accent); }

    /* Кейсы */
    .case-item-row {
      display: grid;
      grid-template-columns: 1fr 1fr 90px 70px 70px 30px;
      gap: 6px;
      margin-bottom: 6px;
    }

    .case-item-row input, .case-item-row select {
      background: var(--surface-input);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px;
      color: var(--text);
      font-size: 12px;
      width: 100%;
    }

    .case-item-row input:focus, .case-item-row select:focus { outline: none; border-color: var(--accent); }

    .case-item-row .remove-item-btn {
      background: var(--danger-bg);
      color: var(--danger-text);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 12px;
    }

    .form-field { margin-bottom: 12px; }
    .form-field label {
      display: block;
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 5px;
      font-weight: 600;
    }
    .form-field input {
      width: 100%;
      background: var(--surface-input);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 11px;
      color: var(--text);
      font-size: 13px;
      transition: border-color 0.15s ease;
    }
    .form-field input:focus { outline: none; border-color: var(--accent); }

    .search-input {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      color: var(--text);
      font-size: 13px;
      margin-bottom: 14px;
      transition: border-color 0.15s ease;
    }

    .search-input:focus { outline: none; border-color: var(--accent); }

    .case-thumb {
      width: 72px;
      height: 62px;
      object-fit: contain;
      background: var(--surface-input);
      border-radius: 10px;
      float: right;
      margin-left: 10px;
    }

    .inventory-modal-item {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--surface-input);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 8px 10px;
      margin-bottom: 8px;
    }

    .inventory-modal-item img {
      width: 38px;
      height: 38px;
      object-fit: contain;
      flex-shrink: 0;
    }

    .inventory-modal-item .inv-name {
      font-size: 12px;
      font-weight: 600;
      flex: 1;
    }

    .inventory-modal-item .inv-value {
      font-size: 12px;
      color: var(--accent);
      font-weight: 700;
    }

    .fab-add {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: linear-gradient(90deg, var(--accent), var(--accent-dark));
      color: #10130a;
      font-weight: 700;
      border: none;
      border-radius: 30px;
      padding: 14px 22px;
      cursor: pointer;
      font-size: 14px;
      box-shadow: 0 6px 20px rgba(198, 255, 30, 0.25);
      z-index: 10;
      transition: transform 0.1s ease;
    }

    .fab-add:active { transform: scale(0.96); }

    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.78);
      backdrop-filter: blur(2px);
      z-index: 50;
      display: none;
      align-items: flex-start;
      justify-content: center;
      overflow-y: auto;
      padding: 20px;
    }

    .modal-overlay.active { display: flex; }

    .modal-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 22px;
      width: 100%;
      max-width: 420px;
      margin-top: 20px;
    }

    .modal-card h2 { font-size: 15px; font-weight: 700; margin-bottom: 16px; }

    .modal-actions { display: flex; gap: 8px; margin-top: 16px; }

    /* ===== Мини-статистика сверху вкладок ===== */
    .stats-bar {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 16px;
    }

    .stat-mini {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      text-align: center;
    }

    .stat-mini-value {
      font-family: "Space Grotesk", sans-serif;
      font-size: 19px;
      font-weight: 700;
      color: var(--accent);
      line-height: 1.2;
    }

    .stat-mini-label {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 3px;
    }

    /* ===== Аватарки и заголовок карточки ===== */
    .avatar-circle {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--accent-dark));
      color: #10130a;
      font-weight: 700;
      font-size: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .avatar-circle-sm {
      width: 34px;
      height: 34px;
      font-size: 13px;
    }

    .card-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .card-header-info {
      flex: 1;
      min-width: 0;
    }

    .card-header-name {
      font-size: 14px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-header-sub {
      font-size: 11px;
      color: var(--text-dim);
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ===== Акцентный блок (сумма/цена/баланс) ===== */
    .card-highlight {
      background: var(--surface-input);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }

    .card-highlight-title {
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 600;
    }

    .card-highlight-value {
      font-family: "Space Grotesk", sans-serif;
      font-weight: 700;
      color: var(--accent);
      font-size: 15px;
      white-space: nowrap;
    }

    /* ===== Пилюли-бейджи (мини-метрики) ===== */
    .pill-row {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }

    .pill {
      background: var(--surface-input);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 5px 11px;
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 600;
    }

    /* ===== Строка трейд-ссылки с кнопкой копирования ===== */
    .trade-link-row {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--surface-input);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 9px 11px;
      margin-bottom: 10px;
    }

    .trade-link-text {
      flex: 1;
      font-size: 11px;
      color: var(--text-muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-family: monospace;
    }

    .copy-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 14px;
      flex-shrink: 0;
      padding: 2px;
    }

    .copy-btn:hover { color: var(--accent); }

    /* ===== Кейсы: превью и цветные чипы предметов по редкости ===== */
    .case-thumb-lg {
      width: 54px;
      height: 46px;
      object-fit: contain;
      background: var(--surface-input);
      border-radius: 10px;
      flex-shrink: 0;
    }

    .item-chip-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 12px;
    }

    .item-chip {
      font-size: 11px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 20px;
      border: 1px solid;
      white-space: nowrap;
      background: rgba(255,255,255,0.02);
    }

    .item-chip.rarity-common { border-color: #565660; color: #a3a3ad; }
    .item-chip.rarity-rare { border-color: #4da6ff; color: #4da6ff; }
    .item-chip.rarity-epic { border-color: #b34dff; color: #b34dff; }
    .item-chip.rarity-legendary { border-color: #ffb800; color: #ffb800; }

</style>
</head>
<body>

  <!-- Экран входа -->
  <div id="login-screen">
    <div class="login-card">
      <div class="login-lock">🔒</div>
      <h1>Админ-панель CS Cases</h1>
      <input type="password" id="password-input" placeholder="Пароль">
      <button class="btn" id="login-btn">Войти</button>
      <div class="error-text" id="login-error"></div>
    </div>
  </div>

  <!-- Основной экран -->
  <div id="app-screen">
    <div class="header">
      <div class="header-logo">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M4 4L12 18L20 4" stroke="#C6FF1E" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <h1>VeDrop<span class="header-tag">ADMIN</span></h1>
      </div>
      <button class="btn-secondary" id="logout-btn">Выйти</button>
    </div>

    <div class="tabs">
      <div class="tab-btn active" data-tab="withdrawals"><span class="tab-icon">💸</span><span class="tab-label" id="tab-label-withdrawals">Выводы</span></div>
      <div class="tab-btn" data-tab="users"><span class="tab-icon">👤</span><span class="tab-label" id="tab-label-users">Игроки</span></div>
      <div class="tab-btn" data-tab="cases"><span class="tab-icon">🎁</span><span class="tab-label" id="tab-label-cases">Кейсы</span></div>
      <div class="tab-btn" data-tab="payments"><span class="tab-icon">💳</span><span class="tab-label" id="tab-label-payments">Платежи</span></div>
      <div class="tab-btn" data-tab="support"><span class="tab-icon">💬</span><span class="tab-label" id="tab-label-support">Поддержка</span></div>
    </div>

    <!-- Заявки на вывод -->
    <div class="tab-content active" id="tab-withdrawals">
      <div class="stats-bar" id="withdrawals-stats"></div>
      <div id="withdrawals-list" class="loading-text">Загрузка...</div>
    </div>

    <!-- Пользователи -->
    <div class="tab-content" id="tab-users">
      <div class="stats-bar" id="users-stats"></div>
      <input type="text" id="users-search" placeholder="Поиск по ID или @юзернейму" class="search-input">
      <div id="users-list" class="loading-text">Загрузка...</div>
    </div>

    <!-- Кейсы -->
    <div class="tab-content" id="tab-cases">
      <div class="stats-bar" id="cases-stats"></div>
      <div id="cases-list" class="loading-text">Загрузка...</div>
      <button class="fab-add" id="add-case-btn">+ Кейс</button>
    </div>

    <!-- Платежи -->
    <div class="tab-content" id="tab-payments">
      <div class="stats-bar" id="payments-stats"></div>
      <div id="payments-list" class="loading-text">Загрузка...</div>
    </div>

    <!-- Поддержка -->
    <div class="tab-content" id="tab-support">
      <div class="stats-bar" id="support-stats"></div>
      <label class="support-filter-row">
        <input type="checkbox" id="support-show-closed"> Показать закрытые диалоги
      </label>
      <div id="support-list" class="loading-text">Загрузка...</div>
    </div>
  </div>

  <!-- Модалка создания/редактирования кейса -->
  <!-- Модалка просмотра инвентаря пользователя -->
  <div class="modal-overlay" id="inventory-modal">
    <div class="modal-card">
      <h2 id="inventory-modal-title">Инвентарь</h2>
      <div id="inventory-modal-list"></div>
      <div class="modal-actions">
        <button class="btn-secondary" id="inventory-modal-close">Закрыть</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="case-modal">
    <div class="modal-card">
      <h2 id="case-modal-title">Новый кейс</h2>

      <div class="form-field">
        <label>ID кейса (латиницей, без пробелов, нельзя изменить у существующего)</label>
        <input type="text" id="case-id-input" placeholder="например, gold-rush">
      </div>
      <div class="form-field">
        <label>Название</label>
        <input type="text" id="case-name-input" placeholder="Золотая Лихорадка">
      </div>
      <div class="form-field">
        <label>Цена (₴)</label>
        <input type="number" id="case-price-input" placeholder="50">
      </div>
      <div class="form-field">
        <label>Путь к картинке кейса (уже загруженной в images/ на GitHub)</label>
        <input type="text" id="case-image-input" placeholder="images/case-gold-rush.png">
      </div>

      <div class="form-field">
        <label>Предметы внутри</label>
        <div id="case-items-editor"></div>
        <button class="btn-secondary" id="add-item-row-btn" style="margin-top:8px;">+ Предмет</button>
      </div>

      <div class="error-text" id="case-modal-error"></div>

      <div class="modal-actions">
        <button class="btn" id="case-save-btn">Сохранить</button>
        <button class="btn-secondary" id="case-cancel-btn">Отмена</button>
      </div>
    </div>
  </div>

<div class="modal-overlay" id="support-chat-modal">
    <div class="modal-card support-chat-card">
      <div class="support-chat-header-row">
        <h2 id="support-chat-title">Чат</h2>
        <span class="status-badge" id="support-chat-status"></span>
      </div>
      <div class="support-chat-actions">
        <button class="btn-secondary" id="support-claim-btn" style="display:none;">Взять на рассмотрение</button>
        <button class="btn-danger" id="support-end-btn">Завершить диалог</button>
      </div>
      <div id="support-chat-messages" class="support-chat-messages"></div>
      <div class="support-chat-input-row">
        <textarea id="support-chat-input" placeholder="Напиши ответ игроку..."></textarea>
        <button class="support-chat-send-btn" id="support-chat-send-btn">➤</button>
      </div>
      <div class="modal-actions">
        <button class="btn-secondary" id="support-chat-close-btn" style="width:100%;">Закрыть окно</button>
      </div>
    </div>
  </div>

<script>
  const API_URL = "https://cs-cases-backend.onrender.com";
  let adminPassword = localStorage.getItem("adminPassword") || "";

  const loginScreen = document.getElementById("login-screen");
  const appScreen = document.getElementById("app-screen");

  async function apiRequest(path, options = {}) {
    const res = await fetch(`${API_URL}${path}`, {
      ...options,
      headers: {
        "Content-Type": "application/json",
        "x-admin-password": adminPassword,
        ...(options.headers || {})
      }
    });
    if (res.status === 401) throw new Error("UNAUTHORIZED");
    return res;
  }

  async function tryLogin(password) {
    adminPassword = password;
    const res = await apiRequest("/api/admin/login", { method: "POST" });
    if (!res.ok) throw new Error("Неверный пароль");
    localStorage.setItem("adminPassword", password);
    showApp();
  }

  document.getElementById("login-btn").addEventListener("click", async () => {
    const password = document.getElementById("password-input").value;
    const errorEl = document.getElementById("login-error");
    errorEl.textContent = "";
    try {
      await tryLogin(password);
    } catch (err) {
      errorEl.textContent = "Неверный пароль";
    }
  });

  document.getElementById("logout-btn").addEventListener("click", () => {
    localStorage.removeItem("adminPassword");
    adminPassword = "";
    appScreen.style.display = "none";
    loginScreen.style.display = "flex";
    clearInterval(supportBackgroundInterval);
  });

  function showApp() {
    loginScreen.style.display = "none";
    appScreen.style.display = "block";
    loadWithdrawals();
    loadUsers();
    loadCases();
    loadPayments();
    loadSupport();
    // Тихий фоновый опрос новых обращений в поддержку — работает независимо от того, какая вкладка открыта
    clearInterval(supportBackgroundInterval);
    supportBackgroundInterval = setInterval(() => loadSupport(true), 6000);
  }

  // Автовход, если пароль уже сохранён в этом браузере
  if (adminPassword) {
    tryLogin(adminPassword).catch(() => {
      loginScreen.style.display = "flex";
    });
  }

  // ===== Переключение вкладок =====
  document.querySelectorAll(".tab-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
      document.querySelectorAll(".tab-content").forEach(c => c.classList.remove("active"));
      btn.classList.add("active");
      document.getElementById(`tab-${btn.dataset.tab}`).classList.add("active");
    });
  });

  function formatDate(str) {
    return new Date(str).toLocaleString("ru-RU", { day: "2-digit", month: "2-digit", year: "2-digit", hour: "2-digit", minute: "2-digit" });
  }

  const statusLabels = {
    pending: "⏳ В обработке",
    accepted: "🔄 В процессе",
    trade_sent: "📤 Трейд отправлен",
    received: "✅ Получено",
    waiting: "⏳ Ожидает оплаты",
    finished: "✅ Оплачено",
    open: "🆘 Новое",
    resolved: "✅ Решено"
  };

  // ===== Заявки на вывод =====
  function avatarInitial(label) {
    return (label || "?").replace("@", "").trim().charAt(0).toUpperCase() || "?";
  }

  function attachCopyButtons(root) {
    root.querySelectorAll("button[data-copy]").forEach(btn => {
      btn.addEventListener("click", (e) => {
        e.stopPropagation();
        navigator.clipboard.writeText(btn.dataset.copy).then(() => {
          const old = btn.textContent;
          btn.textContent = "✅";
          setTimeout(() => { btn.textContent = old; }, 1200);
        }).catch(() => {});
      });
    });
  }

  async function loadWithdrawals() {
    const listEl = document.getElementById("withdrawals-list");
    listEl.innerHTML = `<div class="loading-text">Загрузка...</div>`;
    try {
      const res = await apiRequest("/api/admin/withdrawals");
      const items = await res.json();

      const pendingItems = items.filter(w => w.status === "pending");
      const pendingValue = pendingItems.reduce((sum, w) => sum + w.item_value, 0);
      const withdrawalsTabLabel = document.getElementById("tab-label-withdrawals");
      withdrawalsTabLabel.textContent = pendingItems.length > 0 ? `Выводы (${pendingItems.length})` : "Выводы";
      document.getElementById("withdrawals-stats").innerHTML = `
        <div class="stat-mini"><div class="stat-mini-value">${pendingItems.length}</div><div class="stat-mini-label">Ожидают действия</div></div>
        <div class="stat-mini"><div class="stat-mini-value">${pendingValue.toLocaleString("ru-RU")} ₴</div><div class="stat-mini-label">Сумма к выводу</div></div>
      `;

      if (items.length === 0) {
        listEl.innerHTML = `<div class="empty-text">📭 Заявок пока нет</div>`;
        return;
      }
      listEl.innerHTML = "";
      items.forEach(w => {
        const playerLabel = w.username ? `@${w.username}` : (w.first_name || `ID ${w.telegram_id}`);
        const card = document.createElement("div");
        card.className = "card";
        let actionsHtml = "";
        if (w.status === "pending") {
          actionsHtml = `<button class="btn-secondary" data-action="accepted" data-id="${w.id}">Принять</button>`;
        } else if (w.status === "accepted") {
          actionsHtml = `<button class="btn-secondary" data-action="trade_sent" data-id="${w.id}">Трейд отправлен</button>`;
        } else if (w.status === "trade_sent") {
          actionsHtml = `<button class="btn-secondary" data-action="received" data-id="${w.id}">Получено</button>`;
        }
        card.innerHTML = `
          <div class="card-header">
            <div class="avatar-circle">${avatarInitial(playerLabel)}</div>
            <div class="card-header-info">
              <div class="card-header-name">${playerLabel}</div>
              <div class="card-header-sub">${formatDate(w.requested_at)}</div>
            </div>
            <span class="status-badge status-${w.status}">${statusLabels[w.status] || w.status}</span>
          </div>
          <div class="card-highlight">
            <div class="card-highlight-title">🎁 ${w.item_name}</div>
            <div class="card-highlight-value">${w.item_value} ₴</div>
          </div>
          <div class="trade-link-row">
            <span class="trade-link-text">${w.trade_link}</span>
            <button class="copy-btn" data-copy="${w.trade_link}" title="Скопировать">📋</button>
          </div>
          <div class="card-actions">${actionsHtml}</div>
        `;
        listEl.appendChild(card);
      });

      attachCopyButtons(listEl);

      listEl.querySelectorAll("button[data-action]").forEach(btn => {
        btn.addEventListener("click", async () => {
          btn.disabled = true;
          try {
            await apiRequest(`/api/admin/withdrawals/${btn.dataset.id}/status`, {
              method: "POST",
              body: JSON.stringify({ status: btn.dataset.action })
            });
            loadWithdrawals();
          } catch (err) {
            alert("Не удалось обновить статус");
            btn.disabled = false;
          }
        });
      });
    } catch (err) {
      listEl.innerHTML = `<div class="empty-text">Ошибка загрузки</div>`;
    }
  }

  // ===== Пользователи =====
  let allUsers = []; // кэш для мгновенного поиска без повторных запросов к серверу

  async function loadUsers() {
    const listEl = document.getElementById("users-list");
    listEl.innerHTML = `<div class="loading-text">Загрузка...</div>`;
    try {
      const res = await apiRequest("/api/admin/users");
      allUsers = await res.json();

      const totalBalance = allUsers.reduce((sum, u) => sum + u.balance, 0);
      document.getElementById("users-stats").innerHTML = `
        <div class="stat-mini"><div class="stat-mini-value">${allUsers.length}</div><div class="stat-mini-label">Игроков</div></div>
        <div class="stat-mini"><div class="stat-mini-value">${totalBalance.toLocaleString("ru-RU")} ₴</div><div class="stat-mini-label">Баланс всех игроков</div></div>
      `;

      renderUsersList(allUsers);
    } catch (err) {
      listEl.innerHTML = `<div class="empty-text">Ошибка загрузки</div>`;
    }
  }

  function renderUsersList(items) {
    const listEl = document.getElementById("users-list");
    if (items.length === 0) {
      listEl.innerHTML = `<div class="empty-text">🔍 Никого не найдено</div>`;
      return;
    }
    listEl.innerHTML = "";
    items.forEach(u => {
      const label = u.username ? `@${u.username}` : (u.first_name || "Без имени");
      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML = `
        <div class="card-header">
          <div class="avatar-circle">${avatarInitial(label)}</div>
          <div class="card-header-info">
            <div class="card-header-name">${label}</div>
            <div class="card-header-sub">id ${u.telegram_id} · с ${formatDate(u.created_at)}</div>
          </div>
        </div>
        <div class="card-highlight">
          <div class="card-highlight-title">Баланс</div>
          <div class="card-highlight-value">${u.balance.toLocaleString("ru-RU")} ₴</div>
        </div>
        <div class="pill-row">
          <span class="pill">🎁 ${u.cases_opened} открыто</span>
          <span class="pill">📦 ${u.inventory_count} в инвентаре</span>
        </div>
        <div class="balance-edit">
          <input type="number" placeholder="Новый баланс" id="balance-input-${u.telegram_id}">
          <button class="btn-secondary" data-save-balance="${u.telegram_id}">Сохранить</button>
        </div>
        <div class="card-actions">
          <button class="btn-secondary" data-inventory="${u.telegram_id}" data-label="${label}">📦 Инвентарь (${u.inventory_count})</button>
        </div>
      `;
      listEl.appendChild(card);

      card.querySelector("[data-save-balance]").addEventListener("click", async () => {
        const input = document.getElementById(`balance-input-${u.telegram_id}`);
        const newBalance = parseInt(input.value, 10);
        if (isNaN(newBalance) || newBalance < 0) {
          alert("Введи корректное число");
          return;
        }
        try {
          await apiRequest(`/api/admin/users/${u.telegram_id}/balance`, {
            method: "POST",
            body: JSON.stringify({ balance: newBalance })
          });
          loadUsers();
        } catch (err) {
          alert("Не удалось изменить баланс");
        }
      });

      card.querySelector("[data-inventory]").addEventListener("click", () => {
        openInventoryModal(u.telegram_id, label);
      });
    });
  }

  document.getElementById("users-search").addEventListener("input", (e) => {
    const query = e.target.value.trim().toLowerCase().replace(/^@/, "");
    if (!query) {
      renderUsersList(allUsers);
      return;
    }
    const filtered = allUsers.filter(u =>
      String(u.telegram_id).includes(query) ||
      (u.username || "").toLowerCase().includes(query) ||
      (u.first_name || "").toLowerCase().includes(query)
    );
    renderUsersList(filtered);
  });

  // ===== Модалка инвентаря конкретного пользователя =====
  const inventoryModal = document.getElementById("inventory-modal");

  async function openInventoryModal(telegramId, label) {
    document.getElementById("inventory-modal-title").textContent = `Инвентарь: ${label}`;
    const listEl = document.getElementById("inventory-modal-list");
    listEl.innerHTML = `<div class="loading-text">Загрузка...</div>`;
    inventoryModal.classList.add("active");

    try {
      const res = await apiRequest(`/api/admin/users/${telegramId}/inventory`);
      const items = await res.json();
      if (items.length === 0) {
        listEl.innerHTML = `<div class="empty-text">Инвентарь пуст</div>`;
        return;
      }
      listEl.innerHTML = "";
      items.forEach(i => {
        const statusNote = i.withdraw_status ? ` · ${statusLabels[i.withdraw_status] || i.withdraw_status}` : "";
        const row = document.createElement("div");
        row.className = "inventory-modal-item";
        row.innerHTML = `
          <img src="${i.item_image}" alt="${i.item_name}">
          <div class="inv-name">${i.item_name}${statusNote}</div>
          <div class="inv-value">${i.value} ₴</div>
        `;
        listEl.appendChild(row);
      });
    } catch (err) {
      listEl.innerHTML = `<div class="empty-text">Ошибка загрузки</div>`;
    }
  }

  document.getElementById("inventory-modal-close").addEventListener("click", () => {
    inventoryModal.classList.remove("active");
  });

  // ===== Кейсы =====
  let editingCaseId = null; // null = создаём новый, иначе редактируем существующий

  async function loadCases() {
    const listEl = document.getElementById("cases-list");
    listEl.innerHTML = `<div class="loading-text">Загрузка...</div>`;
    try {
      const res = await apiRequest("/api/admin/cases");
      const items = await res.json();

      const totalItems = items.reduce((sum, c) => sum + c.items.length, 0);
      document.getElementById("cases-stats").innerHTML = `
        <div class="stat-mini"><div class="stat-mini-value">${items.length}</div><div class="stat-mini-label">Кейсов</div></div>
        <div class="stat-mini"><div class="stat-mini-value">${totalItems}</div><div class="stat-mini-label">Предметов всего</div></div>
      `;

      if (items.length === 0) {
        listEl.innerHTML = `<div class="empty-text">🎁 Кейсов пока нет</div>`;
        return;
      }
      listEl.innerHTML = "";
      items.forEach(c => {
        const card = document.createElement("div");
        card.className = "card";
        const itemsChips = c.items
          .map(i => `<span class="item-chip rarity-${i.rarity}">${i.name} · ${i.weight}% · ${i.value}₴</span>`)
          .join("");
        card.innerHTML = `
          <div class="card-header">
            <img src="${c.image}" alt="${c.name}" class="case-thumb-lg">
            <div class="card-header-info">
              <div class="card-header-name">${c.name}</div>
              <div class="card-header-sub">ID: ${c.id} · ${c.items.length} предметов</div>
            </div>
            <div class="card-highlight-value">${c.price} ₴</div>
          </div>
          <div class="item-chip-list">${itemsChips}</div>
          <div class="card-actions">
            <button class="btn-secondary" data-edit="${c.id}">Редактировать</button>
            <button class="btn-danger" data-delete="${c.id}">Удалить</button>
          </div>
        `;
        listEl.appendChild(card);
      });

      listEl.querySelectorAll("button[data-edit]").forEach(btn => {
        btn.addEventListener("click", () => openCaseModal(items.find(c => c.id === btn.dataset.edit)));
      });
      listEl.querySelectorAll("button[data-delete]").forEach(btn => {
        btn.addEventListener("click", async () => {
          if (!confirm("Удалить этот кейс? Действие необратимо.")) return;
          try {
            await apiRequest(`/api/admin/cases/${btn.dataset.delete}`, { method: "DELETE" });
            loadCases();
          } catch (err) {
            alert("Не удалось удалить кейс");
          }
        });
      });
    } catch (err) {
      listEl.innerHTML = `<div class="empty-text">Ошибка загрузки</div>`;
    }
  }

  const caseModal = document.getElementById("case-modal");
  const caseItemsEditor = document.getElementById("case-items-editor");

  function addItemRow(item = { name: "", image: "", rarity: "common", weight: "", value: "" }) {
    const row = document.createElement("div");
    row.className = "case-item-row";
    row.innerHTML = `
      <input type="text" placeholder="Название" class="item-name" value="${item.name}">
      <input type="text" placeholder="images/skin.png" class="item-image" value="${item.image}">
      <select class="item-rarity">
        <option value="common" ${item.rarity === "common" ? "selected" : ""}>common</option>
        <option value="rare" ${item.rarity === "rare" ? "selected" : ""}>rare</option>
        <option value="epic" ${item.rarity === "epic" ? "selected" : ""}>epic</option>
        <option value="legendary" ${item.rarity === "legendary" ? "selected" : ""}>legendary</option>
      </select>
      <input type="number" placeholder="Шанс %" class="item-weight" value="${item.weight}">
      <input type="number" placeholder="Цена ₴" class="item-value" value="${item.value}">
      <button class="remove-item-btn">✕</button>
    `;
    row.querySelector(".remove-item-btn").addEventListener("click", () => row.remove());
    caseItemsEditor.appendChild(row);
  }

  document.getElementById("add-item-row-btn").addEventListener("click", () => addItemRow());

  function openCaseModal(caseData = null) {
    document.getElementById("case-modal-error").textContent = "";
    caseItemsEditor.innerHTML = "";
    editingCaseId = caseData ? caseData.id : null;

    document.getElementById("case-modal-title").textContent = caseData ? "Редактировать кейс" : "Новый кейс";
    document.getElementById("case-id-input").value = caseData ? caseData.id : "";
    document.getElementById("case-id-input").disabled = !!caseData;
    document.getElementById("case-name-input").value = caseData ? caseData.name : "";
    document.getElementById("case-price-input").value = caseData ? caseData.price : "";
    document.getElementById("case-image-input").value = caseData ? caseData.image : "";

    if (caseData && caseData.items.length) {
      caseData.items.forEach(addItemRow);
    } else {
      addItemRow();
    }

    caseModal.classList.add("active");
  }

  document.getElementById("add-case-btn").addEventListener("click", () => openCaseModal());
  document.getElementById("case-cancel-btn").addEventListener("click", () => caseModal.classList.remove("active"));

  document.getElementById("case-save-btn").addEventListener("click", async () => {
    const errorEl = document.getElementById("case-modal-error");
    errorEl.textContent = "";

    const id = document.getElementById("case-id-input").value.trim();
    const name = document.getElementById("case-name-input").value.trim();
    const price = parseInt(document.getElementById("case-price-input").value, 10);
    const image = document.getElementById("case-image-input").value.trim();

    const items = [...caseItemsEditor.querySelectorAll(".case-item-row")].map(row => ({
      name: row.querySelector(".item-name").value.trim(),
      image: row.querySelector(".item-image").value.trim(),
      rarity: row.querySelector(".item-rarity").value,
      weight: parseInt(row.querySelector(".item-weight").value, 10),
      value: parseInt(row.querySelector(".item-value").value, 10)
    }));

    if (!id || !name || !price || !image || items.some(i => !i.name || !i.image || !i.weight || !i.value)) {
      errorEl.textContent = "Заполни все поля, включая все предметы";
      return;
    }

    try {
      if (editingCaseId) {
        await apiRequest(`/api/admin/cases/${editingCaseId}`, {
          method: "PUT",
          body: JSON.stringify({ name, price, image, items })
        });
      } else {
        await apiRequest("/api/admin/cases", {
          method: "POST",
          body: JSON.stringify({ id, name, price, image, items })
        });
      }
      caseModal.classList.remove("active");
      loadCases();
    } catch (err) {
      errorEl.textContent = "Не удалось сохранить кейс";
    }
  });

  // ===== Платежи =====
  const paymentMethodLabels = { crypto: "🪙 Крипта", card: "💳 Карта", stars: "⭐ Telegram Stars" };

  async function loadPayments() {
    const listEl = document.getElementById("payments-list");
    listEl.innerHTML = `<div class="loading-text">Загрузка...</div>`;
    try {
      const res = await apiRequest("/api/admin/payments");
      const items = await res.json();

      const finishedTotal = items.filter(p => p.status === "finished").reduce((sum, p) => sum + p.amount_uah, 0);
      document.getElementById("payments-stats").innerHTML = `
        <div class="stat-mini"><div class="stat-mini-value">${items.length}</div><div class="stat-mini-label">Платежей</div></div>
        <div class="stat-mini"><div class="stat-mini-value">${finishedTotal.toLocaleString("ru-RU")} ₴</div><div class="stat-mini-label">Зачислено всего</div></div>
      `;

      if (items.length === 0) {
        listEl.innerHTML = `<div class="empty-text">💳 Платежей пока нет</div>`;
        return;
      }
      listEl.innerHTML = "";
      items.forEach(p => {
        const playerLabel = p.username ? `@${p.username}` : (p.first_name || `ID ${p.telegram_id}`);
        const amountLine = p.method === "stars"
          ? `${p.amount_uah} ₴ (${p.amount_stars} ⭐)`
          : `${p.amount_uah} ₴ (~$${p.amount_usd})`;
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
          <div class="card-header">
            <div class="avatar-circle">${avatarInitial(playerLabel)}</div>
            <div class="card-header-info">
              <div class="card-header-name">${playerLabel}</div>
              <div class="card-header-sub">${formatDate(p.created_at)} · ${paymentMethodLabels[p.method] || p.method}</div>
            </div>
            <span class="status-badge status-${p.status}">${statusLabels[p.status] || p.status}</span>
          </div>
          <div class="card-highlight">
            <div class="card-highlight-title">Сумма</div>
            <div class="card-highlight-value">${amountLine}</div>
          </div>
          <div class="card-row"><span class="label">Order ID</span><span class="value" style="font-size:11px; font-family:monospace; font-weight:400;">${p.order_id}</span></div>
        `;
        listEl.appendChild(card);
      });
    } catch (err) {
      listEl.innerHTML = `<div class="empty-text">Ошибка загрузки</div>`;
    }
  }

  // ===== Поддержка: список диалогов =====
  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  const supportStatusLabels = {
    new: "🆕 Новое",
    in_progress: "🔍 В работе",
    closed: "✅ Закрыт"
  };

  let supportBackgroundInterval = null;

  // silent = true: обновляем список без мигания "Загрузка..." — используется для фонового опроса
  async function loadSupport(silent = false) {
    const listEl = document.getElementById("support-list");
    const includeClosed = document.getElementById("support-show-closed").checked;
    const scrollPos = listEl.scrollTop;
    if (!silent) listEl.innerHTML = `<div class="loading-text">Загрузка...</div>`;
    try {
      const res = await apiRequest(`/api/admin/support/conversations${includeClosed ? "?include_closed=true" : ""}`);
      const items = await res.json();

      const tabLabelEl = document.getElementById("tab-label-support");
      const totalUnread = items.reduce((sum, c) => sum + parseInt(c.unread_count, 10), 0);
      tabLabelEl.textContent = totalUnread > 0 ? `Поддержка (${totalUnread})` : "Поддержка";
      document.getElementById("support-stats").innerHTML = `
        <div class="stat-mini"><div class="stat-mini-value">${items.length}</div><div class="stat-mini-label">Диалогов</div></div>
        <div class="stat-mini"><div class="stat-mini-value">${totalUnread}</div><div class="stat-mini-label">Непрочитано</div></div>
      `;

      if (items.length === 0) {
        listEl.innerHTML = `<div class="empty-text">💬 Обращений пока нет</div>`;
        return;
      }
      listEl.innerHTML = "";
      items.forEach(c => {
        const playerLabel = c.username ? `@${c.username}` : (c.first_name || `ID ${c.telegram_id}`);
        const unread = parseInt(c.unread_count, 10);
        const prefix = c.last_sender === "admin" ? "Вы: " : (c.last_sender === "system" ? "" : "");
        const card = document.createElement("div");
        card.className = "card support-conv-card" + (unread > 0 ? " support-conv-unread" : "");
        card.innerHTML = `
          <div class="avatar-circle avatar-circle-sm">${avatarInitial(playerLabel)}</div>
          <div class="support-conv-info">
            <div class="support-conv-name">${playerLabel}</div>
            <div class="support-conv-preview">${prefix}${escapeHtml(c.last_message || "")}</div>
          </div>
          <div class="support-conv-meta">
            <div class="support-conv-time">${formatDate(c.last_at)}</div>
            <span class="status-badge status-${c.status}" style="margin-bottom:4px; display:inline-block;">${supportStatusLabels[c.status] || c.status}</span>
            ${unread > 0 ? `<div class="support-unread-badge">${unread}</div>` : ""}
          </div>
        `;
        card.addEventListener("click", () => openSupportChat(c.telegram_id, playerLabel));
        listEl.appendChild(card);
      });
      if (silent) listEl.scrollTop = scrollPos;
    } catch (err) {
      if (!silent) listEl.innerHTML = `<div class="empty-text">Ошибка загрузки</div>`;
    }
  }

  document.getElementById("support-show-closed").addEventListener("change", () => loadSupport());

  // ===== Поддержка: окно чата с конкретным игроком =====
  const supportChatModal = document.getElementById("support-chat-modal");
  const supportChatMessages = document.getElementById("support-chat-messages");
  const supportChatInput = document.getElementById("support-chat-input");
  const supportChatSendBtn = document.getElementById("support-chat-send-btn");
  const supportClaimBtn = document.getElementById("support-claim-btn");
  const supportEndBtn = document.getElementById("support-end-btn");
  const supportChatStatusEl = document.getElementById("support-chat-status");
  let currentChatTelegramId = null;
  let supportChatPollInterval = null;

  async function openSupportChat(telegramId, label) {
    currentChatTelegramId = telegramId;
    document.getElementById("support-chat-title").textContent = label;
    supportChatMessages.innerHTML = `<div class="loading-text">Загрузка...</div>`;
    supportChatModal.classList.add("active");
    await loadChatThread();
    clearInterval(supportChatPollInterval);
    supportChatPollInterval = setInterval(loadChatThread, 4000);
  }

  async function loadChatThread() {
    if (!currentChatTelegramId) return;
    try {
      const res = await apiRequest(`/api/admin/support/${currentChatTelegramId}/messages`);
      const data = await res.json();
      renderChatThread(data.messages);
      updateChatStatus(data.status);
      loadSupport(true); // тихо обновляем список диалогов на фоне
    } catch (err) {
      supportChatMessages.innerHTML = `<div class="empty-text">Ошибка загрузки</div>`;
    }
  }

  function updateChatStatus(status) {
    supportChatStatusEl.textContent = supportStatusLabels[status] || status;
    supportChatStatusEl.className = `status-badge status-${status}`;
    supportClaimBtn.style.display = status === "new" ? "block" : "none";
  }

  function renderChatThread(messages) {
    const wasAtBottom = supportChatMessages.scrollTop + supportChatMessages.clientHeight >= supportChatMessages.scrollHeight - 40;
    if (messages.length === 0) {
      supportChatMessages.innerHTML = `<div class="support-chat-empty">Сообщений пока нет</div>`;
      return;
    }
    supportChatMessages.innerHTML = messages.map(m => {
      const time = formatDate(m.created_at);
      const cls = m.sender === "admin" ? "chat-bubble-admin-side" : (m.sender === "system" ? "chat-bubble-system" : "chat-bubble-user-side");
      return `<div class="chat-bubble ${cls}">${escapeHtml(m.message)}<div class="chat-bubble-time">${time}</div></div>`;
    }).join("");
    if (wasAtBottom) supportChatMessages.scrollTop = supportChatMessages.scrollHeight;
  }

  document.getElementById("support-chat-close-btn").addEventListener("click", () => {
    supportChatModal.classList.remove("active");
    clearInterval(supportChatPollInterval);
    currentChatTelegramId = null;
  });

  async function sendSupportReply() {
    const message = supportChatInput.value.trim();
    if (!message || !currentChatTelegramId) return;
    supportChatInput.value = "";
    supportChatSendBtn.disabled = true;
    try {
      await apiRequest(`/api/admin/support/${currentChatTelegramId}/send`, {
        method: "POST",
        body: JSON.stringify({ message })
      });
      await loadChatThread();
    } catch (err) {
      alert("Не удалось отправить ответ");
    }
    supportChatSendBtn.disabled = false;
    supportChatInput.focus();
  }

  supportChatSendBtn.addEventListener("click", sendSupportReply);
  supportChatInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      sendSupportReply();
    }
  });

  supportClaimBtn.addEventListener("click", async () => {
    if (!currentChatTelegramId) return;
    supportClaimBtn.disabled = true;
    try {
      await apiRequest(`/api/admin/support/${currentChatTelegramId}/claim`, { method: "POST" });
      await loadChatThread();
    } catch (err) {
      alert("Не удалось выполнить действие");
    }
    supportClaimBtn.disabled = false;
  });

  supportEndBtn.addEventListener("click", async () => {
    if (!currentChatTelegramId) return;
    if (!confirm("Завершить диалог? Игрок получит уведомление, что проблема решена. Переписка у него сохранится.")) return;
    supportEndBtn.disabled = true;
    try {
      await apiRequest(`/api/admin/support/${currentChatTelegramId}/close`, { method: "POST" });
      supportChatModal.classList.remove("active");
      clearInterval(supportChatPollInterval);
      currentChatTelegramId = null;
      loadSupport();
    } catch (err) {
      alert("Не удалось завершить диалог");
    }
    supportEndBtn.disabled = false;
  });
</script>

</body>
</html>
