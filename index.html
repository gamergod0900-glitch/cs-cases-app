<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CS Cases</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
 
    body {
      background: #0e0e12;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding-bottom: 80px; /* место под нижнее меню */
    }
 
    /* Шапка */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px;
      background: #16161c;
      position: sticky;
      top: 0;
      z-index: 10;
    }
 
    .header .logo {
      font-size: 18px;
      font-weight: 700;
    }
 
    .balance {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #23232c;
      padding: 8px 14px;
      border-radius: 20px;
      font-weight: 600;
      font-size: 14px;
    }
 
    /* Сетка кейсов */
    .cases-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
      padding: 16px;
    }
 
    .case-card {
      background: #17171f;
      border-radius: 16px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      border: 1px solid #24242e;
      transition: transform 0.15s ease;
    }
 
    .case-card:active {
      transform: scale(0.96);
    }
 
    .case-card img {
      width: 100%;
      max-width: 130px;
      height: 110px;
      object-fit: contain;
      margin-bottom: 10px;
    }
 
    .case-card .case-name {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 8px;
      min-height: 34px;
    }
 
    .case-card .case-price {
      background: linear-gradient(90deg, #ffb800, #ff7a00);
      color: #1a1a1a;
      font-weight: 700;
      font-size: 13px;
      padding: 6px 14px;
      border-radius: 12px;
      width: 100%;
    }
 
    /* Нижняя навигация */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      display: flex;
      background: #16161c;
      border-top: 1px solid #24242e;
      padding: 10px 0;
    }
 
    .nav-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      color: #888;
    }
 
    .nav-item.active {
      color: #ffb800;
    }
 
    .nav-item .icon {
      font-size: 20px;
    }
  </style>
</head>
<body>
 
  <div class="header">
    <div class="logo">🎁 CS Cases</div>
    <div class="balance">💰 <span id="balance-value">1 250 ₴</span></div>
  </div>
 
  <div class="cases-grid" id="cases-grid">
    <!-- Кейсы будут вставлены сюда через JS -->
  </div>
 
  <div class="bottom-nav">
    <div class="nav-item active">
      <div class="icon">🎁</div>
      <div>Кейсы</div>
    </div>
    <div class="nav-item">
      <div class="icon">🎒</div>
      <div>Инвентарь</div>
    </div>
    <div class="nav-item">
      <div class="icon">👤</div>
      <div>Профиль</div>
    </div>
  </div>
 
  <script>
    // Инициализация Telegram Mini App
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }
 
    // Список кейсов
    const cases = [
      {
        id: "gold",
        name: "Штурмовой Арсенал",
        price: 50,
        image: "images/case-gold.png"
      },
      {
        id: "platinum",
        name: "Клинок Императора",
        price: 200,
        image: "images/case-platinum.png"
      },
      {
        id: "silver",
        name: "Тайный Агент",
        price: 30,
        image: "images/case-silver.png"
      }
    ];
 
    const grid = document.getElementById("cases-grid");
 
    cases.forEach(c => {
      const card = document.createElement("div");
      card.className = "case-card";
      card.innerHTML = `
        <img src="${c.image}" alt="${c.name}">
        <div class="case-name">${c.name}</div>
        <div class="case-price">${c.price} ₴</div>
      `;
      card.addEventListener("click", () => {
        // Пока просто заглушка — позже тут будет открытие кейса
        alert(`Скоро тут будет открытие кейса "${c.name}"`);
      });
      grid.appendChild(card);
    });
  </script>
 
</body>
</html>
